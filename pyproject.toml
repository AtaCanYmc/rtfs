[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtfs"
version = "0.1.0"
description = "Multi-Source Movie & TV Script CLI + Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "httpx>=0.27.0",
    "selectolax>=1.0.2",
    "rapidfuzz>=3.9.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.14.3",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "diskcache>=5.6.3",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0.0",
]
mcp = [
    "mcp>=1.2.0",
]
all = [
    "redis>=5.0.0",
    "mcp>=1.2.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.17.5",
]

[project.scripts]
rtfs = "rtfs.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rtfs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
