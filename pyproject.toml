[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrtfs"
version = "0.1.4"
description = "Multi-Source Movie & TV Script CLI + Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "AtaCanYmc", email = "atacanymc@gmail.com" },
]
keywords = ["screenplay", "script", "fountain", "movie", "tv", "cli", "mcp", "pymupdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "selectolax>=1.0.2",
    "rapidfuzz>=3.9.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.14.3",
    "typer>=0.29.2",
    "rich>=15.0.0",
    "diskcache>=5.6.3",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0.0",
]
mcp = [
    "mcp>=1.2.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]
ocr = [
    "pytesseract>=0.3.13",
    "pillow>=10.0.0",
]
semantic = [
    "fastembed>=0.3.6",
]
tui = [
    "textual>=0.85.0",
]
all = [
    "redis>=5.0.0",
    "mcp>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pytesseract>=0.3.13",
    "pillow>=10.0.0",
    "fastembed>=0.3.6",
    "textual>=0.85.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.17.5",
    "mypy>=1.11.0",
]

[project.urls]
Homepage = "https://github.com/AtaCanYmc/rtfs"
Repository = "https://github.com/AtaCanYmc/rtfs"
Issues = "https://github.com/AtaCanYmc/rtfs/issues"
Changelog = "https://github.com/AtaCanYmc/rtfs/blob/main/CHANGELOG.md"

[project.scripts]
rtfs = "rtfs.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rtfs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "src/rtfs/exporters/fdx_exp.py",
    "src/rtfs/core/cache/base.py",
    "src/rtfs/parsers/pdf/extract.py",
    "src/rtfs/core/http.py",
]
