<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rtfs-architecture-title rtfs-architecture-desc" id="rtfs-architecture-root">
        <title id="rtfs-architecture-title">rtfs Package Architecture</title>
        <desc id="rtfs-architecture-desc">Layered module map showing CLI, Python SDK, and FastMCP entrypoints feeding rtfs.core orchestration, HTTP/cache infrastructure, and ScriptDocument AST models across providers, parsers, and exporters.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #rtfs-architecture-root { --color-paper:   #08080A;
      --color-paper-2: #101013;
      --color-ink:     #F2EFE9;
      --color-muted:   #8A8A93;
      --color-accent:  #E5A93C;
      --color-link:    #739FDF;
      --font-sans:     'Inter', 'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, SFMono-Regular, monospace; }
      #rtfs-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #rtfs-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#rtfs-architecture-root .diagram-container { overflow-x: visible; }
}</style>
