<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rtfs Package Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #08080A;
      --color-paper-2: #101013;
      --color-ink:     #F2EFE9;
      --color-muted:   #8A8A93;
      --color-accent:  #E5A93C;
      --color-link:    #739FDF;
      --font-sans:     'Inter', 'Geist', system-ui, -apple-system, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, SFMono-Regular, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1120px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Module Architecture · rtfs</p>
    <h1>Entrypoints, core orchestration, and pluggable pipeline layers</h1>

    <div class="diagram-container">

        <desc id="rtfs-architecture-desc">Layered module map showing CLI, Python SDK, and FastMCP entrypoints feeding rtfs.core orchestration, HTTP/cache infrastructure, and ScriptDocument AST models across providers, parsers, and exporters.</desc>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739FDF"/></marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#08080A"/>

        <!-- Zones (drawn first) -->
        <!-- Zone 1: ENTRYPOINTS -->
        <rect x="32" y="24" width="896" height="116" rx="8" fill="rgba(242,239,233,0.02)" stroke="rgba(242,239,233,0.10)" stroke-width="0.8"/>
        <rect x="52" y="28" width="96" height="12" rx="2" fill="#08080A"/>
        <text x="100" y="37" fill="#8A8A93" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ENTRYPOINTS</text>

        <!-- Zone 2: CORE -->

        <rect x="52" y="180" width="124" height="12" rx="2" fill="#08080A"/>
        <text x="114" y="189" fill="#8A8A93" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CORE · RTFS.CORE</text>

        <!-- Zone 3: PLUGINS -->

        <text x="326" y="301" fill="#8A8A93" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

        <rect x="488" y="314" width="44" height="12" rx="2" fill="#08080A"/>
        <text x="510" y="323" fill="#8A8A93" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PARSE</text>

        <rect x="72" y="218" width="52" height="12" rx="2" fill="transparent" stroke="rgba(115,159,223,0.40)" stroke-width="0.8"/>
        <text x="98" y="227" fill="#739FDF" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">NETWORK</text>
        <text x="184" y="246" fill="#F2EFE9" font-size="12" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">http.py &amp; cache/</text>
        <text x="184" y="262" fill="#8A8A93" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PinnedDNS · Disk · Redis</text>

        <text x="480" y="414" fill="#8A8A93" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pdf_x0 · fdx · html · txt</text>
